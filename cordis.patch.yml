# Bundle wiring for `dsh plugin add` / registry installs.
# Ships safe, machine-independent defaults:
#   * no `proxy` — add one only when this machine's outbound IP is a datacenter IP and
#     Anthropic answers 403 (e.g. `proxy: http://127.0.0.1:7890`). A `proxy` pointing at a
#     port with no service makes every delegation fail with ECONNREFUSED
#     ("API Error: Connection refused").
#   * no `permissionMode: bypassPermissions` — delegated sessions are headless, so bypass
#     means a Claude with no permission checks at all. `acceptEdits` is the recommended mode.
# timeoutMs = hard abort (2h); warnTimeoutMs/warnIntervalMs = periodic warnings in the panel (defaults 1h/30m).
- insert:
    - id: claude-code
      name: dsh-claude-code
      config:
        model: sonnet
        permissionMode: acceptEdits
        maxTurns: 100
        timeoutMs: 7200000
